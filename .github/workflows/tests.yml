name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        filament: ['5']
        include:
          # The oldest Filament the package supports. Its attributes differ, so PHPStan runs on Filament 5 only.
          - php: '8.3'
            laravel: '12'
            filament: '4.13.3'
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl
          coverage: pcov

      - name: Install Laravel ${{ matrix.laravel }} and Filament ${{ matrix.filament }}
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "filament/filament:${{ matrix.filament == '5' && '^5.8.3' || matrix.filament }}" --no-update --no-interaction
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate --no-interaction

      - name: Pest, with at least 95% coverage
        run: vendor/bin/pest --coverage --min=95

      - name: PHPStan, level 10
        if: matrix.filament == '5'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Code style
        if: matrix.php == '8.4' && matrix.laravel == '13'
        run: vendor/bin/pint --test . ../src ../tests ../database ../config

  javascript:
    name: JavaScript · lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: The built files are up to date
        run: npm run build && git diff --exit-code -- resources/dist

  browser:
    name: Browsers · ${{ matrix.browser }} · ${{ matrix.transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        transport: [polling, reverb]
        include:
          - browser: webkit
            transport: polling
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - run: npm run build

      - name: Scenarios
        run: npm run test:e2e
        env:
          BROWSER: ${{ matrix.browser }}
          TRANSPORT: ${{ matrix.transport == 'reverb' && 'reverb' || '' }}
